spring.application.name=assistant-service

server.port=8086

# OpenTelemetry
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces
management.tracing.sampling.probability=1.0

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Database
spring.datasource.url=${ASSISTANT_DB_URL}
spring.datasource.username=${ASSISTANT_DB_USER}
spring.datasource.password=${ASSISTANT_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5

# Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true

# OpenAPI
springdoc.api-docs.path=/assistant/v3/api-docs

# Gemini (Google AI Studio)
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-3.8-flash
spring.ai.google.genai.chat.options.temperature=0.2

# Redis
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=3s

# Chat memory
onride.assistant.chat-ttl=30m
