server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/api/v1/auth/**, /api/v1/riders/**, /api/v1/drivers/**
              filters:
                - StripPrefix=2

            - id: location-service
              uri: lb://LOCATION-SERVICE
              predicates:
                - Path=/api/v1/locations/**
              filters:
                - StripPrefix=2

            - id: ride-service
              uri: lb://RIDE-SERVICE
              predicates:
                - Path=/api/v1/rides/**
              filters:
                - StripPrefix=2

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
  tracing:
    sampling:
      probability: 1.0

springdoc:
  swagger-ui:
    urls:
      - name: ride-service
        url: /api/v1/rides/v3/api-docs
      - name: auth-service
        url: /api/v1/auth/v3/api-docs
      - name: location-service
        url: /api/v1/locations/v3/api-docs

onride:
  jwt:
    secret: ${JWT_SECRET}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:900}

