spring.application.name=ride-service

server.port=8083

# Database
spring.datasource.url=${RIDE_DB_URL}
spring.datasource.username=${RIDE_DB_USER}
spring.datasource.password=${RIDE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5

# Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway
# Off until the first migration exists.
spring.flyway.enabled=false

# Pricing
onride.pricing.road-factor=1.4
onride.pricing.average-speed-kmph=25
onride.pricing.quote-ttl=90s

# Redis
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=3s

# Feign
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=3000

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka