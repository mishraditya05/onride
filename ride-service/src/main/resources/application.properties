spring.application.name=ride-service

server.port=8083

# Database
spring.datasource.url=${RIDE_DB_URL}
spring.datasource.username=${RIDE_DB_USER}
spring.datasource.password=${RIDE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5

# Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true

# Pricing
onride.pricing.road-factor=1.4
onride.pricing.average-speed-kmph=25
onride.pricing.quote-ttl=90s

# Redis
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=3s

# Feign
# spring.cloud.openfeign.client.config.default.connect-timeout=2000
# spring.cloud.openfeign.client.config.default.read-timeout=3000

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# gRPC
grpc.client.location-service.address=discovery:///location-service
grpc.client.location-service.negotiation-type=plaintext
grpc.client.matching-service.address=discovery:///matching-service
grpc.client.matching-service.negotiation-type=plaintext

# OpenAPI
springdoc.api-docs.path=/rides/v3/api-docs

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
spring.kafka.properties.schema.registry.url=${SCHEMA_REGISTRY_URL:http://localhost:8085}
kafka.topic.ride-requested-topic=ride-requested-topic