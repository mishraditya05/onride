apiVersion: v1
kind: Secret
metadata:
  name: ride-service-secret
  namespace: onride
type: Opaque
stringData:
  RIDE_DB_URL: "jdbc:postgresql://your-neon-host/neondb?sslmode=require"
  RIDE_DB_USER: "changeme"
  RIDE_DB_PASSWORD: "changeme"
  REDIS_URL: "redis://default:changeme@your-redis-host:6379"