apiVersion: apps/v1
kind: Deployment
metadata:
  name: ride-service
  namespace: onride
  labels:
    app: ride-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ride-service
  template:
    metadata:
      labels:
        app: ride-service
    spec:
      enableServiceLinks: false
      containers:
        - name: ride-service
          image: docker.io/allstar98k/onride-ride-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8083
          env:
            - name: MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT
              value: "http://jaeger:4318/v1/traces"
            - name: EUREKA_CLIENT_ENABLED
              value: "false"
            - name: SERVER_FORWARD_HEADERS_STRATEGY
              value: "framework"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:29092"
            - name: SCHEMA_REGISTRY_URL
              value: "http://schema-registry:8085"
            - name: GRPC_CLIENT_LOCATION_SERVICE_ADDRESS
              value: "static://location-service:9095"
            - name: GRPC_CLIENT_MATCHING_SERVICE_ADDRESS
              value: "static://matching-service:9096"
            - name: RIDE_DB_URL
              valueFrom:
                secretKeyRef:
                  name: ride-service-secret
                  key: RIDE_DB_URL
            - name: RIDE_DB_USER
              valueFrom:
                secretKeyRef:
                  name: ride-service-secret
                  key: RIDE_DB_USER
            - name: RIDE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ride-service-secret
                  key: RIDE_DB_PASSWORD
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: ride-service-secret
                  key: REDIS_URL
          resources:
            requests:
              memory: "384Mi"
              cpu: "150m"
            limits:
              memory: "512Mi"
              cpu: "400m"

---

apiVersion: v1
kind: Service
metadata:
  name: ride-service
  namespace: onride
spec:
  selector:
    app: ride-service
  ports:
    - port: 8083
      targetPort: 8083