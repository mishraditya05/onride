spring.application.name=location-service

server.port=8082

onride.location.position-ttl=1h
onride.location.stale-after=1h
onride.location.search-rings=1

# Redis
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=3s

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# gRPC
grpc.server.port=9095
eureka.instance.metadata-map.gRPC_port=${grpc.server.port}

# OpenAPI
springdoc.api-docs.path=/locations/v3/api-docs

