spring.application.name=location-service

server.port=8082

# H3
# res 9 = ~174m edge, ~0.1 km2 per cell; k=1 covers ~500m
onride.location.h3-resolution=9
onride.location.position-ttl=1h
onride.location.stale-after=1h
onride.location.search-rings=1

# Redis
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=3s

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

